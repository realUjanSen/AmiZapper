name: Build and release APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || format('v0.0.{0}', github.run_number) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: bash ./gradlew assembleRelease

      - name: Prepare APK asset
        shell: bash
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk AmiZapper-${{ env.RELEASE_TAG }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AmiZapper ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: AmiZapper-${{ env.RELEASE_TAG }}.apk